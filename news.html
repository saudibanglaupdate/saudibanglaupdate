<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saudi Bangla Update | News</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#006400;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

img{
width:100%;
border-radius:10px;
margin-bottom:20px;
}

h1{
margin-bottom:15px;
}

.back{
display:inline-block;
margin-top:20px;
background:#006400;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
}

footer{
margin-top:30px;
background:#111;
color:white;
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>
<h1>Saudi Bangla Update</h1>
</header>

<div class="container">

<img id="image">

<h1 id="title"></h1>

<p id="content"></p>

<a href="index.html" class="back">
⬅ Back Home
</a>

</div>

<footer>

© 2026 Saudi Bangla Update

</footer>
<script>
async function loadNews(){

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

const { data, error } = await supabase
.from("news_posts")
.select("*")
.eq("id", id)
.single();

if(error){
document.getElementById("title").innerText="News not found";
return;
}

document.getElementById("title").innerText=data.title;

document.getElementById("content").innerText=data.content;

document.getElementById("image").src=data.image_url;

document.getElementById("image").alt=data.title;

}

loadNews();
</script>

</body>
</html>
